<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,900&family=Figtree:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
	<link href="css/materialize.min.css" type="text/css" rel="stylesheet" media="screen,projection" />
	<link href="css/index.css" type="text/css" rel="stylesheet" media="screen,projection" />
	<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.5/dist/dotlottie-wc.js" type="module"></script>
	<meta property="og:image" content="./img/pokerBanner.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="screen-orientation" content="landscape" />
	<meta name="theme-color" content="#0a0c10">
	<title>All-In</title>
</head>

<body>
	<div class="room-atmosphere" aria-hidden="true">
		<div class="room-lamp"></div>
		<div class="room-grain"></div>
	</div>

	<div id="rotateHint" class="rotate-hint" aria-live="polite">
		<div class="rotate-hint-card">
			<div class="rotate-hint-phone" aria-hidden="true"></div>
			<p>请将手机横屏游玩</p>
		</div>
	</div>

	<button type="button" id="fullscreenBtn" class="fullscreen-btn" hidden>全屏</button>

	<div id="gameDiv" class="poker-room" style="display:none;">
		<div class="table-hud">
			<div id="table-title" class="table-hud-message"></div>
		</div>

		<div class="table-stage">
			<div class="poker-table">
				<div class="table-rail"></div>
				<div class="table-felt">
					<div id="countdown" class="felt-countdown"></div>
					<div class="pot-area">
						<span class="pot-label">POT</span>
						<dotlottie-wc
							class="chip-lottie chip-lottie--pot"
							src="./img/lottie-trial/chip-shuffle.lottie"
							autoplay
							loop
							speed="0.85"
							aria-hidden="true"
						></dotlottie-wc>
						<span id="potAmount" class="pot-amount">$0</span>
					</div>
					<div id="communityCards" class="community-cards"></div>
				</div>
				<div id="opponentCards" class="seats-ring"></div>
			</div>
			<div class="action-dock">
				<div id="playNext" class="play-next-wrap"></div>
				<div class="action-buttons">
					<button onClick="fold()" id="usernameFold" class="action-btn action-fold">Fold</button>
					<button onClick="check()" id="usernameCheck" class="action-btn action-check">Check</button>
					<button id="usernameBet" class="action-btn action-bet">Bet</button>
					<button onClick="call()" id="usernameCall" class="action-btn action-call">Call</button>
					<button id="usernameRaise" class="action-btn action-raise">Raise</button>
					<button onClick="confirmAllIn()" id="usernameAllIn" class="action-btn action-allin">All-In</button>
				</div>
			</div>
		</div>
	</div>

	<div id="rebuyBar" class="rebuy-bar" style="display:none;">
		<p>筹码用完了</p>
		<button type="button" class="btn rebuy-btn" onclick="requestRebuy()">Buy 2000 (+耻辱币)</button>
		<button type="button" class="btn spectate-btn" onclick="dismissRebuyPrompt()">观战</button>
	</div>

	<div id="mainContent" class="lobby-screen">
		<div class="lobby-hero">
			<p class="lobby-kicker">私人好友局</p>
			<h1 class="lobby-title">
				<span class="lobby-title-all">All</span><span class="lobby-title-dash">-</span><span class="lobby-title-in">In</span>
			</h1>
			<p class="lobby-subtitle">初始 2000 筹码 · 推到极限</p>
			<div class="lobby-actions">
				<a id="hostButton" class="lobby-btn lobby-btn-primary" href="#">创建房间</a>
				<a id="joinButton" class="lobby-btn lobby-btn-secondary" href="#">加入房间</a>
			</div>
			<span class="lobby-suit lobby-suit-a" aria-hidden="true">♠</span>
			<span class="lobby-suit lobby-suit-b" aria-hidden="true">♥</span>
			<span class="lobby-suit lobby-suit-c" aria-hidden="true">♣</span>
		</div>
	</div>

	<div id="hostModal" class="lobby-modal">
		<div class="modal-backdrop"></div>
		<div class="modal-panel">
			<div class="modal-content">
				<h4>创建房间</h4>
				<div id="hostModalContent">
					<p>输入昵称，系统会生成 4 位房间码发给朋友。</p>
					<div class="input-field">
						<label for="hostName-field">昵称</label>
						<input type="text" name="name" id="hostName-field" maxlength="12" required />
					</div>
					<button onclick="beginHost()" type="button" class="modal-action-btn">获取房间码</button>
				</div>
				<div id="playersNames"></div>
				<div id="startGameArea"></div>
			</div>
			<div class="modal-footer">
				<a href="#" class="modal-close modal-action-btn modal-action-muted">关闭</a>
			</div>
		</div>
	</div>

	<div id="joinModal" class="lobby-modal">
		<div class="modal-backdrop"></div>
		<div class="modal-panel">
			<div class="modal-content">
				<h4>加入房间</h4>
				<div id="joinModalContent">
					<p>输入昵称和房主给你的房间码。</p>
					<div class="input-field">
						<label for="joinName-field">昵称</label>
						<input type="text" name="name" id="joinName-field" maxlength="12" required />
					</div>
					<div class="input-field">
						<label for="code-field">房间码</label>
						<input type="text" name="code" id="code-field" required />
					</div>
					<button onclick="joinRoom()" type="button" class="modal-action-btn">加入</button>
				</div>
				<div id="playersNamesJoined"></div>
				<div id="startGameAreaDisconnectSituation"></div>
			</div>
			<div class="modal-footer">
				<a href="#" class="modal-close modal-action-btn modal-action-muted">关闭</a>
			</div>
		</div>
	</div>

	<div id="betModal" class="lobby-modal">
		<div class="modal-backdrop"></div>
		<div class="modal-panel">
			<div class="modal-content">
				<h4>下注</h4>
				<div id="betDisplay"><h4>拖动滑块选择金额</h4></div>
				<p class="range-field">
					<input type="range" id="betRangeSlider" min="0" max="100" value="0"
						onchange="updateBetDisplay()" oninput="updateBetDisplay()" />
				</p>
				<button onclick="bet(); closeLobbyModal();" type="button" class="modal-action-btn">确认下注</button>
			</div>
			<div class="modal-footer">
				<a href="#" class="modal-close modal-action-btn modal-action-muted">关闭</a>
			</div>
		</div>
	</div>

	<div id="raiseModal" class="lobby-modal">
		<div class="modal-backdrop"></div>
		<div class="modal-panel">
			<div class="modal-content">
				<h4>加注</h4>
				<div id="raiseDisplay"></div>
				<p class="range-field">
					<input type="range" id="raiseRangeSlider" min="0" max="100" value="0"
						onchange="updateRaiseDisplay()" oninput="updateRaiseDisplay()" />
				</p>
				<button onclick="raise(); closeLobbyModal();" type="button" class="modal-action-btn">确认加注</button>
			</div>
			<div class="modal-footer">
				<a href="#" class="modal-close modal-action-btn modal-action-muted">关闭</a>
			</div>
		</div>
	</div>

	<div id="confirmModal" class="lobby-modal">
		<div class="modal-backdrop"></div>
		<div class="modal-panel">
			<div class="modal-content">
				<h4 id="confirmTitle">确认</h4>
				<p id="confirmMessage" style="margin: 10px 0 0; line-height: 1.65; opacity: 0.92"></p>
			</div>
			<div class="modal-footer">
				<a href="#" id="confirmCancel" class="modal-action-btn modal-action-muted">取消</a>
				<a href="#" id="confirmOk" class="modal-action-btn" style="margin-left: 10px">确认</a>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
	<script src="./js/materialize.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/1.5.0/socket.io.min.js"></script>
	<script src="./main.js"></script>
</body>

</html>
